<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рабочий Контроль — Трекер сотрудников</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">РК</div>
          <div class="logo-text">
            <h1>Рабочий Контроль</h1>
            <p>Сотрудники &bull; Объекты &bull; Время &bull; Расчёты</p>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="role-section">
          <label class="role-label">Демо-роль</label>
          <select class="role-select" id="roleSelect">
            <option value="manager">Руководитель</option>
            <option value="worker">Рабочий</option>
            <option value="foreman">Бригадир</option>
            <option value="accountant">Бухгалтер</option>
          </select>
        </div>
        <button class="btn-reset" id="resetBtn" title="Сбросить демо-данные">
          <span class="btn-reset-icon">&#8634;</span> Сбросить данные
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <div class="topbar-breadcrumb" id="topbarBreadcrumb"></div>
        <div class="topbar-user" id="topbarUser"></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header" id="modalHeader">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
